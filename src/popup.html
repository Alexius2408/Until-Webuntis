<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <span class="mark" aria-hidden="true">
        <svg
          viewBox="3.5 4.1 17 17"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <g class="mark__bell">
            <path
              d="M7.5 15.75h9M8.6 15.75v-4.15a3.4 3.4 0 0 1 6.8 0v4.15M12 6.4v1.9"
            />
            <circle
              class="mark__clapper"
              cx="12"
              cy="18.2"
              r="1.5"
              fill="currentColor"
              stroke="none"
            />
          </g>
          <path
            class="mark__wave mark__wave--left"
            d="M5.25 8.6a4.9 4.9 0 0 0-.75 3"
          />
          <path
            class="mark__wave mark__wave--right"
            d="M18.75 8.6a4.9 4.9 0 0 1 .75 3"
          />
        </svg>
      </span>
      <div>
        <h1 data-i18n="extName">Until</h1>
      </div>
    </header>

    <main>
      <section class="group" aria-label="Emoji" data-i18n-label="emojiSection">
        <div class="list">
          <label class="row" id="emoji-label">
            <span class="row__text">
              <span class="row__name" data-i18n="lessonEmoji"
                >Lesson emoji</span
              >
              <span class="row__desc" data-i18n="lessonEmojiDesc"
                >Click to choose, or paste one</span
              >
            </span>
            <input
              type="text"
              id="emoji-input"
              class="emoji-input"
              placeholder="🪑"
              autocomplete="off"
              spellcheck="false"
              aria-haspopup="dialog"
              aria-expanded="false"
              aria-controls="emoji-picker"
            />
          </label>
        </div>

        <!-- Filled by ui.js -->
        <div
          class="picker"
          id="emoji-picker"
          role="dialog"
          aria-label="Choose an emoji"
          data-i18n-label="pickerLabel"
          inert
        >
          <div class="picker__grid"></div>
          <div class="picker__foot">
            <span data-i18n="pickerFoot">Or paste any emoji</span>
            <span class="picker__shortcut"></span>
          </div>
        </div>
      </section>

      <section class="group" aria-labelledby="remind-title">
        <h2 class="group__title" id="remind-title" data-i18n="remindTitle">
          Remind me with
        </h2>
        <div class="list">
          <label class="row">
            <span class="row__text">
              <span class="row__name" data-i18n="notification"
                >Notification</span
              >
              <span class="row__desc" data-i18n="notificationDesc"
                >Show a system notification</span
              >
            </span>
            <input
              type="checkbox"
              role="switch"
              id="notification"
              class="switch-input"
            />
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label class="row">
            <span class="row__text">
              <span class="row__name" data-i18n="alert">Alert</span>
              <span class="row__desc" data-i18n="alertDesc"
                >Alert on the WebUntis page</span
              >
            </span>
            <input
              type="checkbox"
              role="switch"
              id="alert"
              class="switch-input"
            />
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label class="row row--number">
            <span class="row__text">
              <span class="row__name" data-i18n="remindMinutes"
                >Remind me minutes before lesson ends</span
              >
            </span>
            <input
              type="number"
              id="remindMinutes"
              class="number-input"
              min="0"
              max="60"
              value="5"
            />
          </label>
        </div>
      </section>

      <section class="group" aria-labelledby="show-title">
        <h2 class="group__title" id="show-title">
          <span data-i18n="showBefore">Show</span>
          <span class="emoji-mirror" data-emoji-mirror>🪑</span>
          <span data-i18n="showAfter">in WebUntis</span>
        </h2>
        <div class="list">
          <label class="row">
            <span class="row__text">
              <span class="row__name" data-i18n="onLessons">On lessons</span>
              <span class="row__desc" data-i18n="onLessonsDesc"
                >Marks the lesson in your timetable</span
              >
            </span>
            <input
              type="checkbox"
              role="switch"
              id="lesson"
              class="switch-input"
            />
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label class="row">
            <span class="row__text">
              <span class="row__name" data-i18n="sidebar">In the sidebar</span>
              <span class="row__desc" data-i18n="sidebarDesc"
                >Show the emoji in the side panel</span
              >
            </span>
            <input
              type="checkbox"
              role="switch"
              id="taskbar"
              class="switch-input"
            />
            <span class="switch" aria-hidden="true"></span>
          </label>
          <label class="row row--number">
            <span class="row__text">
              <span class="row__name" data-i18n="highlightMinutes"
                >Highlight emoji minutes before end</span
              >
            </span>
            <input
              type="number"
              id="showMinutes"
              class="number-input"
              min="0"
              max="100"
              value="48"
            />
          </label>
        </div>
      </section>
    </main>

    <footer class="footer">
      <svg
        class="footer__logo"
        viewBox="0 0 16 16"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"
        />
      </svg>
      <!-- Text comes from _locales/, the links stay fixed here -->
      <p>
        <span data-i18n="footerBefore">Check out my</span>
        <a
          href="https://github.com/Alexius2408"
          target="_blank"
          rel="noopener"
          data-i18n="footerProfile"
          >GitHub Profile</a
        >
        <span data-i18n="footerMiddle">or the</span>
        <a
          href="https://github.com/Alexius2408/Until-Webuntis"
          target="_blank"
          rel="noopener"
          data-i18n="footerRepo"
          >Until Repo</a
        ><span data-i18n="footerAfter"></span>
      </p>
    </footer>
    <script src="variables.js"></script>
    <script src="script.js"></script>
    <script src="ui.js"></script>
  </body>
</html>
